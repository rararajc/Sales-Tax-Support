name: Total App Heartbeat

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # This step checks if GitHub can actually see your secrets
      - name: Verify Secrets Exist
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then echo "ERROR: SUPABASE_URL is empty"; exit 1; fi
          if [ -z "${{ secrets.SUPABASE_KEY }}" ]; then echo "ERROR: SUPABASE_KEY is empty"; exit 1; fi

      - name: Ping Supabase API
        run: |
          curl -v -X GET "https://ygwrkfzpgkzxkufwyalk.supabase.co/rest/v1/user?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"

      - name: Push Empty Commit
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git commit --allow-empty -m "Heartbeat: Resetting Streamlit and Supabase timers"
          git push
