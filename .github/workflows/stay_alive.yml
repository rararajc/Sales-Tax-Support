name: Total App Heartbeat

on:
  schedule:
    - cron: '0 0 * * *' # Runs exactly once a day at midnight UTC
  workflow_dispatch:      # Allows you to click "Run workflow" manually

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # --- TASK 2: POKE SUPABASE ---
      - name: Ping Supabase API
        run: |
          # We use select=* so it doesn't matter what your column names are
          curl -f -v -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/users?select=*&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
          -H "User-Agent: Mozilla/5.0"

      # --- TASK 3: EMPTY COMMIT ---
      - name: Push Empty Commit
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git commit --allow-empty -m "Heartbeat: Resetting Streamlit and Supabase timers"
          git push
